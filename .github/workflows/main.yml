1. Lead Generation

Google/website enquiries
WhatsApp calls/messages
Facebook/Instagram ads
Government/GeM/eTender
Existing customer referrals

⬇️

2. Customer Enquiry
Collect:

Customer/company name
Contact person
Mobile number
Location
Requirement
Number/type of extinguishers
Fire alarm/hydrant requirement
AMC/refilling/new installation

⬇️

3. Site Survey
For bigger projects:

Visit site
Check existing fire equipment
Take photos
Identify deficiencies
Prepare requirement

⬇️

4. Quotation
Prepare quotation with:

Product/service
Quantity
Rate
GST
Installation/service charges
Payment terms
Warranty
Validity

⬇️

5. Follow-Up System
Every quotation should have a status:

New → Quotation Sent → Follow-up → Negotiation → Approved → Work Started → Completed → Payment Pending → Closed

⬇️

6. Work Execution
For example, extinguisher service:

Pickup → Inspection → Refilling → HPT if required → Cleaning/Painting → Reassembly → Pressure Check → Service Tag → Delivery

For installation:

Material → Site Preparation → Installation → Testing → Commissioning → Customer Approval

⬇️

7. Invoice & Payment

Generate invoice
Send invoice + work completion report
Track due date
Automatic payment reminder

⬇️

8. AMC / Repeat Business
This is very important for your business.

Keep the next due date for:

Fire extinguisher servicing
Fire alarm AMC
Hydrant maintenance
Safety audit
Fire NOC renewal

Then automatically remind the customer before the due date.

